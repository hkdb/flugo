name: webauthn
description: Flutter plugin for WebAuthn/FIDO2 external security keys (Android via Credential Manager, iOS via AuthenticationServices). Ships with flugo.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.11.1
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.flugo.webauthn
        pluginClass: WebauthnPlugin
      ios:
        pluginClass: WebauthnPlugin
